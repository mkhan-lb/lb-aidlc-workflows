name: Logicbroker distribution

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lb-distribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test tests/distribution/lb.test.ts
      - name: Build combined candidate
        run: bun scripts/package-lb.ts build/lb-aidlc-workflows
      - name: Archive including hidden harness directories
        run: tar -czf build/lb-aidlc-workflows.tar.gz -C build lb-aidlc-workflows
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lb-aidlc-workflows-${{ github.sha }}
          path: build/lb-aidlc-workflows.tar.gz
          if-no-files-found: error
