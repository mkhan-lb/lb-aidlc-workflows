name: Logicbroker distribution

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lb-distribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Fetch the pinned AWS native engine for consumer tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/aws-aidlc"
          gh release download v2.8.1 --repo awslabs/aidlc-workflows \
            --pattern aidlc-linux-x64 --dir "$RUNNER_TEMP/aws-aidlc"
          cd "$RUNNER_TEMP/aws-aidlc"
          echo '61be3a8521693ab80e84da09c4264ce6623c86333740df3f64a12a8c89279213  aidlc-linux-x64' | sha256sum --check
          chmod +x aidlc-linux-x64
          echo "LB_AIDLC_NATIVE_EXECUTABLE=$RUNNER_TEMP/aws-aidlc/aidlc-linux-x64" >> "$GITHUB_ENV"
      - name: Fetch verified legacy migration fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/legacy/aws270" "$RUNNER_TEMP/legacy/lb011"
          git archive 96b11d39028955d4f92375e783525db5275cdfd8 dist | tar -xf - -C "$RUNNER_TEMP/legacy/aws270"
          gh release download lb-v0.1.1 --repo mkhan-lb/lb-aidlc-workflows \
            --pattern lb-aidlc-workflows.tar.gz --dir "$RUNNER_TEMP/legacy"
          cd "$RUNNER_TEMP/legacy"
          echo 'b76f728eae02b7d2aa9d4bdd2f407b50d3e0508b0ccdea8d048fe54b6c4f44b9  lb-aidlc-workflows.tar.gz' | sha256sum --check
          tar -xzf lb-aidlc-workflows.tar.gz --strip-components=1 -C lb011
          echo "LB_AIDLC_LEGACY_ROOT=$RUNNER_TEMP/legacy" >> "$GITHUB_ENV"
      - run: bun run check
      - run: bun test tests/distribution/lb.test.ts
      - name: Build combined candidate
        run: bun scripts/package-lb.ts build/lb-aidlc-workflows
      - name: Archive including hidden harness directories
        run: tar -czf build/lb-aidlc-workflows.tar.gz -C build lb-aidlc-workflows
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lb-aidlc-workflows-${{ github.sha }}
          path: build/lb-aidlc-workflows.tar.gz
          if-no-files-found: error
